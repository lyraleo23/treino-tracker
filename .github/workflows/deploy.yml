name: Deploy no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; não cancela o que já está em andamento.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # enablement liga o Pages via API na primeira execução, em vez de exigir
      # que ele já esteja configurado à mão em Settings → Pages.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # O padrão de 10 min vinha abortando um deploy que o GitHub ainda não
      # tinha terminado — e é o próprio action que marca o deployment como
      # falho ao desistir. 30 min dão margem para a lentidão do lado deles.
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
